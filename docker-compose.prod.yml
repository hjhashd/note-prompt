version: '3.8'

services:
  note-prompt:
    extends:
      file: docker-compose.yml
      service: note-prompt
    ports:
      - "${APP_PORT:-10086}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VITE_APP_ENV=production
      # 使用环境变量注入，如果未定义则回退到容器服务名
      - PYTHON_API_URL=${PYTHON_API_URL:-http://python-backend:12543}
      - JAVA_API_URL=${JAVA_API_URL:-http://java-backend:18081}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

services:
  note-prompt:
    extends:
      file: docker-compose.yml
      service: note-prompt
    ports:
      - "${APP_PORT:-10086}:80"
    environment:
      - VITE_APP_ENV=production
      - NGINX_LISTEN_PORT=80
      # 使用环境变量注入，如果未定义则回退到容器服务名
      - PYTHON_API_URL=${PYTHON_API_URL:-http://python-backend:12543}
      - JAVA_API_URL=${JAVA_API_URL:-http://java-backend:18081}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "sh", "-lc", "curl -f http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

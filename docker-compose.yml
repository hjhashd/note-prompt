version: '3.8'

services:
  note-prompt:
    build:
      context: .
      dockerfile: Dockerfile
    # ports:  <-- 移除了这里的 ports，改为在具体的 dev/prod 文件中定义
    environment:
      - PYTHON_API_URL=${PYTHON_API_URL:-http://python-backend:12543}
      - JAVA_API_URL=${JAVA_API_URL:-http://java-backend:${JAVA_PORT:-18081}}
    restart: always

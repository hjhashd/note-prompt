<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>提示词平台</title>
  </head>
  <body>
    <div id="app">
      <style>
        .loading-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          background-color: #F0F4F9; /* --bg-primary */
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          z-index: 9999;
        }
        
        .loading-logo {
          width: 48px;
          height: 48px;
          margin-bottom: 24px;
          animation: float 3s ease-in-out infinite;
        }
        
        .loading-spinner {
          width: 40px;
          height: 40px;
          border: 3px solid rgba(59, 130, 246, 0.1);
          border-top: 3px solid #3B82F6; /* --primary */
          border-radius: 50%;
          animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          margin-bottom: 16px;
        }
        
        .loading-text {
          color: #64748B; /* --text-secondary / gray-500 */
          font-size: 14px;
          font-weight: 500;
          letter-spacing: 0.05em;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
        
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }
      </style>
      <div class="loading-container">
        <!-- Try to use the logo if it loads, otherwise the spinner is enough context -->
        <img src="/logo.svg" class="loading-logo" alt="Logo" onerror="this.style.display='none'" />
        <div class="loading-spinner"></div>
        <div class="loading-text">正在启动 Prompt Studio...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

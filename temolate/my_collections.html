<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - NotePrompt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Monochromatic Blue Color Scheme */
            --blue-50: #F0F7FF;
            --blue-100: #E0EFFF;
            --blue-200: #BAE0FF;
            --blue-300: #7CC4FA;
            --blue-400: #36A5F3;
            --blue-500: #0B87E3;
            --blue-600: #0068C9;
            --blue-700: #0046A3;
            --blue-800: #003378;
            --blue-900: #001F52;

            /* Teal/Turquoise Accent */
            --teal-50: #F0FDFA;
            --teal-100: #CCFBF1;
            --teal-400: #2DD4BF;
            --teal-500: #14B8A6;
            --teal-600: #0D9488;

            /* Neutral Colors */
            --white: #FFFFFF;
            --gray-50: #F8FAFC;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-300: #CBD5E1;
            --gray-400: #94A3B8;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
            --gray-900: #0F172A;

            /* Semantic Colors */
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

            /* Border Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-normal: 200ms ease;
            --transition-slow: 300ms ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

        /* App Layout */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: all var(--transition-normal);
            z-index: 1000;
        }

        .sidebar.collapsed {
            width: 60px;
            padding: 20px 8px;
        }

        .sidebar-toggle {
            position: absolute;
            top: 24px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-fast);
            z-index: 1001;
        }

        .sidebar-toggle:hover {
            background: var(--gray-50);
            box-shadow: var(--shadow-md);
        }

        .sidebar.collapsed .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .sidebar.collapsed .brand-text,
        .sidebar.collapsed .nav-link span,
        .sidebar.collapsed .create-btn span,
        .sidebar.collapsed .search-container,
        .sidebar.collapsed .user-details {
            display: none;
        }

        .sidebar.collapsed .brand {
            justify-content: center;
        }

        .sidebar.collapsed .create-btn {
            justify-content: center;
            padding: 10px;
        }

        .sidebar.collapsed .nav-link {
            padding: 10px;
            justify-content: center;
        }

        .sidebar.collapsed .user-info {
            justify-content: center;
            padding: 12px;
        }

        .sidebar-header {
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
        }

        .brand-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .create-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
            border: none;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            color: var(--white);
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
        }

        .create-btn:hover {
            background: linear-gradient(135deg, var(--blue-600), var(--blue-700));
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .sidebar-nav {
            flex: 1;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .nav-item {
            margin-bottom: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            color: var(--gray-700);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-fast);
            cursor: pointer;
        }

        .nav-link:hover {
            background: var(--gray-50);
            color: var(--gray-900);
        }

        .nav-link.active {
            background: var(--blue-50);
            color: var(--blue-600);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-container {
            margin-top: auto;
            margin-bottom: 24px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--gray-800);
            transition: all var(--transition-normal);
        }

        .search-box input::placeholder {
            color: var(--gray-400);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--blue-400);
            background: var(--white);
            box-shadow: 0 0 0 3px var(--blue-100);
        }

        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            width: 18px;
            height: 18px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--gray-50);
            border-radius: var(--radius-md);
            margin-top: auto;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue-400), var(--blue-600));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 14px;
            font-weight: 600;
        }

        .user-details {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-800);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-email {
            font-size: 12px;
            color: var(--gray-500);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 32px;
            min-height: 100vh;
            transition: margin-left var(--transition-normal);
        }

        .sidebar.collapsed + .main-content {
            margin-left: 60px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .page-desc {
            font-size: 14px;
            color: var(--gray-500);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.blue {
            background: var(--blue-100);
            color: var(--blue-600);
        }

        .stat-icon.teal {
            background: var(--teal-100);
            color: var(--teal-600);
        }

        .stat-icon svg {
            width: 20px;
            height: 20px;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .stat-label {
            font-size: 12px;
            color: var(--gray-500);
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-600);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .filter-tab:hover {
            border-color: var(--blue-300);
            color: var(--blue-600);
        }

        .filter-tab.active {
            background: var(--blue-500);
            border-color: var(--blue-500);
            color: var(--white);
        }

        .view-toggle {
            display: flex;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .view-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--gray-500);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .view-btn:hover {
            background: var(--gray-50);
        }

        .view-btn.active {
            background: var(--blue-500);
            color: var(--white);
        }

        .view-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Collection Grid */
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .collection-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .collection-card:hover {
            border-color: var(--blue-300);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .collection-header {
            padding: 16px;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .collection-type {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
        }

        .collection-type-badge {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .collection-type-badge.blue {
            background: var(--blue-500);
        }

        .collection-type-badge.teal {
            background: var(--teal-500);
        }

        .collection-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .collection-card:hover .collection-actions {
            opacity: 1;
        }

        .action-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            color: var(--gray-400);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .action-btn:hover {
            background: var(--gray-100);
            color: var(--gray-600);
        }

        .action-btn.delete:hover {
            background: var(--blue-50);
            color: var(--blue-600);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .collection-body {
            padding: 16px;
        }

        .collection-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collection-title svg {
            width: 18px;
            height: 18px;
            color: var(--blue-500);
        }

        .collection-desc {
            font-size: 13px;
            color: var(--gray-500);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .collection-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag {
            padding: 4px 10px;
            background: var(--gray-100);
            border-radius: var(--radius-full);
            font-size: 11px;
            color: var(--gray-600);
        }

        .collection-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--gray-100);
            font-size: 12px;
            color: var(--gray-400);
        }

        .collection-date {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .collection-date svg {
            width: 14px;
            height: 14px;
        }

        .collection-source {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .collection-source svg {
            width: 14px;
            height: 14px;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            color: var(--gray-300);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--gray-500);
        }

        .empty-state .action-btn {
            margin-top: 16px;
            width: auto;
            padding: 10px 20px;
            background: var(--blue-500);
            color: var(--white);
            border-radius: var(--radius-md);
            font-weight: 500;
        }

        .empty-state .action-btn:hover {
            background: var(--blue-600);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 240px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .stats-bar {
                flex-wrap: wrap;
                gap: 16px;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-tabs {
                justify-content: center;
            }

            .collection-grid {
                grid-template-columns: 1fr;
            }

            .content-layout {
                flex-direction: column;
            }

            .tag-directory {
                margin-bottom: 24px;
            }
        }

        /* Content Layout */
        .content-layout {
            display: flex;
            gap: 24px;
        }

        /* Tag Directory */
        .tag-directory {
            width: 280px;
            padding: 16px;
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            height: fit-content;
            position: sticky;
            top: 32px;
        }

        .directory-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .directory-title svg {
            width: 16px;
            height: 16px;
            color: var(--blue-500);
        }

        .tree-item {
            margin-bottom: 8px;
        }

        .tree-item-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
        }

        .tree-item-header:hover {
            background: var(--gray-50);
            color: var(--gray-900);
        }

        .tree-icon {
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .tree-icon.rotated {
            transform: rotate(90deg);
        }

        .tree-item-name {
            font-weight: 500;
            color: var(--gray-700);
        }

        .tree-item-children {
            margin-left: 20px;
            margin-top: 4px;
            display: block;
        }

        .tree-item-children.collapsed {
            display: none;
        }

        .tree-item-prompt {
            padding: 6px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 12px;
            color: var(--gray-600);
            margin-bottom: 4px;
        }

        .tree-item-prompt:hover {
            background: var(--blue-50);
            color: var(--blue-600);
        }

        .tree-item-prompt.active {
            background: var(--blue-100);
            color: var(--blue-700);
            font-weight: 500;
        }

        /* Collections Content */
        .collections-content {
            flex: 1;
        }

        /* Search Container */
        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            width: 16px;
            height: 16px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--gray-800);
            transition: all var(--transition-normal);
        }

        .search-input::placeholder {
            color: var(--gray-400);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--blue-400);
            background: var(--white);
            box-shadow: 0 0 0 3px var(--blue-100);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-toggle" onclick="toggleSidebar()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </div>
                    <div class="brand-text">NotePrompt</div>
                </div>
                <button class="create-btn" onclick="showPromptOptimus()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>新建提示词</span>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-item">
                        <div class="nav-link" onclick="navigateTo('noteprompt_final.html')">
                            <div class="nav-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>

    <script>
        // Sidebar toggle functionality

        // Initialize sidebar state

            document.getElementById('sidebar').classList.remove('collapsed');

        // Collection data
        const collections = [
            {

            {
                id: '3',

                description: '为产品、服务创建吸引人的营销文案，包括社交媒体、广告和邮件内容',
                type: 'writing',
                tags: ['营销', '文案', '社交媒体'],

            },
            {
                id: '4',
                title: 'UI设计灵感生成器',
                description: '根据需求生成UI设计灵感和建议，包括配色方案、布局和交互设计',
                type: 'design',
                tags: ['UI设计', '灵感', '配色方案'],
                date: '2024-01-08',
                source: '公共文件夹'
            },
            {
                id: '5',
                title: '数据分析助手',
                description: '帮助分析数据、生成洞察和可视化建议，支持多种数据分析场景',
                type: 'ai',

                date: '2024-01-05',

            {
                id: '6',

                type: 'writing',
                tags: ['创意写作', '灵感', '小说'],

                source: '公共文件夹'
            },
            {
                id: '7',
                title: '前端代码优化器',
                description: '分析和优化前端代码，提高性能和可维护性，支持HTML、CSS和JavaScript',
                type: 'coding',
                tags: ['前端', '代码优化', '性能'],
                date: '2024-01-01',
                source: '我的提示词'
            },

                id: '8',
                title: '品牌标识设计指南',
                description: '帮助创建和完善品牌标识，包括标志设计、色彩系统和品牌语音',
                type: 'design',
                tags: ['品牌设计', '标志', '色彩系统'],
                date: '2023-12-28',
                source: '公共文件夹'
            }
        ];

        // DOM Elements
        const collectionGrid = document.getElementById('collectionGrid');
        const filterTabs = document.querySelectorAll('.filter-tab');
        const viewBtns = document.querySelectorAll('.view-btn');

        // State
        let currentFilter = 'all';
        let searchQuery = '';

        // Tree item toggle functionality
        function toggleTreeItem(element) {
            const icon = element.querySelector('.tree-icon');
            const children = element.nextElementSibling;
            
            if (children) {
                children.classList.toggle('collapsed');
                icon.classList.toggle('rotated');
            }
        }

        // Filter by category
        function filterCategory(category, element) {
            // Remove active class from all filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all tree item prompts
            document.querySelectorAll('.tree-item-prompt').forEach(item => {
                item.classList.remove('active');
            });
            
            // Add active class to the clicked element
            element.classList.add('active');
            
            // Update current filter
            currentFilter = category === 'all' ? 'all' : 
                           category === 'ai' ? 'ai' : 
                           category === 'coding' ? 'coding' : 
                           category === 'writing' ? 'writing' : 'design';
            
            renderCollections();
        }

        // Handle search
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderCollections();
        }

        // Render collections
        function renderCollections() {
            let filteredCollections = [...collections];

            // Apply filter
            if (currentFilter !== 'all') {
                filteredCollections = filteredCollections.filter(collection => collection.type === currentFilter);
            }

            // Apply search
            if (searchQuery) {
                filteredCollections = filteredCollections.filter(collection => 
                    collection.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    collection.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    collection.tags.some(tag => tag.toLowerCase().includes(searchQuery.toLowerCase()))
                );
            }

            // Render collection cards
            collectionGrid.innerHTML = filteredCollections.map(collection => `
                <div class="collection-card">
                    <div class="collection-header">
                        <div class="collection-type">
                            <div class="collection-type-badge ${collection.type === 'ai' || collection.type === 'coding' ? 'blue' : 'teal'}"></div>
                            ${collection.type === 'ai' ? 'AI工具' : collection.type === 'coding' ? '编程' : collection.type === 'writing' ? '写作' : '设计'}
                        </div>
                        <div class="collection-actions">
                            <button class="action-btn" title="打开">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 9 9z"></path>
                                    <path d="M21 12v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path>
                                </svg>
                            </button>
                            <button class="action-btn" title="使用">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                            </button>
                            <button class="action-btn delete" title="移除收藏">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 6h18"></path>
                                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="collection-body">
                        <div class="collection-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            ${collection.title}
                        </div>
                        <p class="collection-desc">${collection.description}</p>
                        <div class="collection-tags">
                            ${collection.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="collection-meta">
                            <div class="collection-date">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                ${collection.date}
                            </div>
                            <div class="collection-source">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                    <path d="M2 17l10 5 10-5"></path>
                                    <path d="M2 12l10 5 10-5"></path>
                                </svg>
                                ${collection.source}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Event listeners
        filterTabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // Update active tab
                filterTabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                // Remove active class from all tree item prompts
                document.querySelectorAll('.tree-item-prompt').forEach(item => {
                    item.classList.remove('active');
                });
                
                // Update filter
                currentFilter = this.dataset.filter;
                renderCollections();
            });
        });

        viewBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                viewBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // In a real app, you would toggle between grid and list view
            });
        });

        // Initial render
        renderCollections();
